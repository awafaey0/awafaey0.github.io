<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-label="Ahmed Wafaey: I take frontier AI from demo to production in messy, multi-market businesses.">
<style>
  .bg{fill:#0d1117} .card{fill:#151b23;stroke:#3d444d}
  .ink{fill:#e6edf3;font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif} .muted{fill:#9198a1;font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif}
  .mono{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace} .acc{fill:#8ea6ff} .good{fill:#3fb950}
  .fade{opacity:0;animation:fade .7s ease-out forwards}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .pulse{animation:pulse 2s ease-in-out infinite;transform-origin:center;transform-box:fill-box}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
</style><defs>
  <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#262c36"/></pattern>
  <linearGradient id="rail" gradientUnits="userSpaceOnUse" x1="78" y1="0" x2="1140" y2="0"><stop offset="0" stop-color="#3d444d"/><stop offset=".55" stop-color="#8ea6ff"/><stop offset="1" stop-color="#c4a7ff"/></linearGradient>
  <linearGradient id="name" x1="0" x2="1"><stop offset="0" stop-color="#e6edf3"/><stop offset="1" stop-color="#8ea6ff"/></linearGradient>
</defs>
<rect class="card" x="1" y="1" width="1198" height="338" rx="18"/>
<rect x="1" y="1" width="1198" height="338" rx="18" fill="url(#dots)" opacity=".7"/>
<g class="fade">
  <text x="56" y="72" class="muted mono" font-size="14" letter-spacing="2.5">MODEL CARD · v15.0 · NOV 2026</text>
  <text x="54" y="142" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="64" font-weight="700" letter-spacing="-1.5" fill="url(#name)">Ahmed Wafaey</text>
</g>
<g class="fade" style="animation-delay:.25s">
  <text x="56" y="194" class="ink" font-size="26" font-weight="500">I take frontier AI from demo to production</text>
  <text x="56" y="228" class="muted" font-size="26">in messy, multi-market businesses.</text>
</g>
<clipPath id="type"><rect x="56" y="262" height="32" width="0">
  <animate attributeName="width" values="0;0;640;640" keyTimes="0;.12;.6;1" dur="7s" repeatCount="indefinite"/></rect></clipPath>
<text x="56" y="284" class="acc mono" font-size="17" clip-path="url(#type)">$ now shipping → fustat.ai · korba.ai · EBS Dx · rituals.pm</text>
<rect x="56" y="268" width="9" height="20" class="acc">
  <animate attributeName="x" values="56;56;662;662" keyTimes="0;.12;.6;1" dur="7s" repeatCount="indefinite"/>
  <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/></rect>
<g class="fade" style="animation-delay:.5s">
  <rect class="card" x="828" y="56" width="316" height="228" rx="12" style="fill:#0d1117"/>
  <text x="852" y="108" class="muted mono" font-size="15">base</text><text x="1112" y="108" class="ink mono" font-size="15" text-anchor="end">Berlin</text><text x="852" y="138" class="muted mono" font-size="15">languages</text><text x="1112" y="138" class="ink mono" font-size="15" text-anchor="end">EN · AR · DE</text><text x="852" y="168" class="muted mono" font-size="15">experience</text><text x="1112" y="168" class="ink mono" font-size="15" text-anchor="end">20 yrs</text><text x="852" y="198" class="muted mono" font-size="15">markets</text><text x="1112" y="198" class="ink mono" font-size="15" text-anchor="end">75 countries</text><text x="852" y="228" class="muted mono" font-size="15">education</text><text x="1112" y="228" class="ink mono" font-size="15" text-anchor="end">Durham EMBA</text>
  <text x="852" y="258" class="muted mono" font-size="15">status</text>
  <circle cx="1022" cy="253" r="5" class="good pulse"/>
  <text x="1112" y="258" class="good mono" font-size="15" text-anchor="end">shipping</text>
</g>
</svg>