<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-label="fustat.ai pipeline: screens and KR, critic, LLM-as-judge with hallucination guard, persona ensemble with self-consistency sampling, verdict; human overrides feed the team's bar back into the critic. Lab notes on model routing, golden set and calibration.">
<style>
  .bg{fill:#0d1117} .card{fill:#151b23;stroke:#3d444d}
  .ink{fill:#e6edf3;font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif} .muted{fill:#9198a1;font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif}
  .mono{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace} .acc{fill:#8ea6ff} .good{fill:#3fb950}
  .fade{opacity:0;animation:fade .7s ease-out forwards}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .pulse{animation:pulse 2s ease-in-out infinite;transform-origin:center;transform-box:fill-box}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
</style><defs>
  <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#262c36"/></pattern>
  <linearGradient id="rail" gradientUnits="userSpaceOnUse" x1="78" y1="0" x2="1140" y2="0"><stop offset="0" stop-color="#3d444d"/><stop offset=".55" stop-color="#8ea6ff"/><stop offset="1" stop-color="#c4a7ff"/></linearGradient>
  <linearGradient id="name" x1="0" x2="1"><stop offset="0" stop-color="#e6edf3"/><stop offset="1" stop-color="#8ea6ff"/></linearGradient>
</defs>
<style>.flow{stroke-dasharray:4 5;animation:flow 1s linear infinite} @keyframes flow{to{stroke-dashoffset:-18}}</style>
<rect class="card" x="1" y="1" width="1198" height="428" rx="18"/>
<text x="30" y="44" class="muted mono" font-size="14" letter-spacing="2.5">FUSTAT.AI · UNDER THE HOOD</text>
<text x="1170" y="44" class="muted mono" font-size="13" text-anchor="end">Claude · Cloudflare · D1 · MCP server</text>
<g class="fade" style="animation-delay:0.00s"><rect x="30" y="74" width="210" height="120" rx="12" fill="#0d1117" stroke="#3d444d" stroke-width="1"/><text x="46" y="102" class="muted mono" font-size="11" letter-spacing="1.5">01 · INPUT</text><text x="46" y="132" class="ink" font-size="19" font-weight="700">Screens + KR</text><text x="46" y="158" class="muted" font-size="13">the flow, and the goal</text><text x="46" y="176" class="muted" font-size="13">it has to move</text></g><path d="M243 134 H259" stroke="#8ea6ff" stroke-width="2" class="flow"/><g class="fade" style="animation-delay:0.12s"><rect x="262" y="74" width="210" height="120" rx="12" fill="#0d1117" stroke="#3d444d" stroke-width="1"/><text x="278" y="102" class="muted mono" font-size="11" letter-spacing="1.5">02 · CRITIC</text><text x="278" y="132" class="ink" font-size="19" font-weight="700">Critic</text><text x="278" y="158" class="muted" font-size="13">critiques the flow</text><text x="278" y="176" class="muted" font-size="13">against the KR, not taste</text></g><path d="M475 134 H491" stroke="#8ea6ff" stroke-width="2" class="flow"/><g class="fade" style="animation-delay:0.24s"><rect x="494" y="74" width="210" height="120" rx="12" fill="#0d1117" stroke="#8ea6ff" stroke-width="2"/><text x="510" y="102" class="acc mono" font-size="11" letter-spacing="1.5">03 · JUDGE</text><text x="510" y="132" class="ink" font-size="19" font-weight="700">LLM-as-judge</text><text x="510" y="158" class="muted" font-size="13">scores the critique /30</text><text x="510" y="176" class="muted" font-size="13">hallucination guard</text></g><path d="M707 134 H723" stroke="#8ea6ff" stroke-width="2" class="flow"/><g class="fade" style="animation-delay:0.36s"><rect x="726" y="74" width="210" height="120" rx="12" fill="#0d1117" stroke="#8ea6ff" stroke-width="2"/><text x="742" y="102" class="acc mono" font-size="11" letter-spacing="1.5">04 · ENSEMBLE</text><text x="742" y="132" class="ink" font-size="19" font-weight="700">Persona panel</text><text x="742" y="158" class="muted" font-size="13">one judge per persona</text><text x="742" y="176" class="muted" font-size="13">each sampled 1 · 3 · 5×</text></g><path d="M939 134 H955" stroke="#8ea6ff" stroke-width="2" class="flow"/><g class="fade" style="animation-delay:0.48s"><rect x="958" y="74" width="210" height="120" rx="12" fill="#0d1117" stroke="#3d444d" stroke-width="1"/><text x="974" y="102" class="muted mono" font-size="11" letter-spacing="1.5">05 · VERDICT</text><text x="974" y="132" class="ink" font-size="19" font-weight="700">Verdict</text><text x="974" y="158" class="muted" font-size="13">confidence + the fixes</text><text x="974" y="176" class="muted" font-size="13">the panel agrees on</text></g><g class="fade" style="animation-delay:0.60s"><rect class="card" x="30" y="300" width="362" height="100" rx="12" style="fill:#0d1117"/><text x="46" y="328" class="acc mono" font-size="11" letter-spacing="1.5">TESTED · MODEL ROUTING</text><text x="46" y="356" class="ink" font-size="14" font-weight="600">Could a cheaper model be the judge?</text><text x="46" y="380" class="muted" font-size="13">83–100% escalated anyway. Killed it on evidence.</text></g><g class="fade" style="animation-delay:0.72s"><rect class="card" x="405" y="300" width="362" height="100" rx="12" style="fill:#0d1117"/><text x="421" y="328" class="acc mono" font-size="11" letter-spacing="1.5">BUILDING · GOLDEN SET</text><text x="421" y="356" class="ink" font-size="14" font-weight="600">A fixed test set for every model swap.</text><text x="421" y="380" class="muted" font-size="13">A new model must pass with zero hallucinations.</text></g><g class="fade" style="animation-delay:0.84s"><rect class="card" x="780" y="300" width="362" height="100" rx="12" style="fill:#0d1117"/><text x="796" y="328" class="acc mono" font-size="11" letter-spacing="1.5">LEARNED · CALIBRATION</text><text x="796" y="356" class="ink" font-size="14" font-weight="600">The judge can be wrong too.</text><text x="796" y="380" class="muted" font-size="13">Next: calibrate it against human verdicts.</text></g>
