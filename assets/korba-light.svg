<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-label="korba.ai under the hood: surface, plays, skills, MCP and models; built by one founder with an agent team (Pam PM, Des design, Bob builder); share-to-install growth loop with attribution.">
<style>
  .bg{fill:#ffffff} .card{fill:#f6f8fa;stroke:#d1d9e0}
  .ink{fill:#1f2328;font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif} .muted{fill:#59636e;font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif}
  .mono{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace} .acc{fill:#3b5bdb} .good{fill:#1a7f37}
  .fade{opacity:0;animation:fade .7s ease-out forwards}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .pulse{animation:pulse 2s ease-in-out infinite;transform-origin:center;transform-box:fill-box}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
</style><defs>
  <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#e4e8ec"/></pattern>
  <linearGradient id="rail" gradientUnits="userSpaceOnUse" x1="78" y1="0" x2="1140" y2="0"><stop offset="0" stop-color="#d1d9e0"/><stop offset=".55" stop-color="#3b5bdb"/><stop offset="1" stop-color="#7048e8"/></linearGradient>
  <linearGradient id="name" x1="0" x2="1"><stop offset="0" stop-color="#1f2328"/><stop offset="1" stop-color="#3b5bdb"/></linearGradient>
</defs>
<rect class="card" x="1" y="1" width="1198" height="428" rx="18"/>
<text x="30" y="44" class="muted mono" font-size="14" letter-spacing="2.5">KORBA.AI · UNDER THE HOOD</text>
<text x="1170" y="44" class="muted mono" font-size="13" text-anchor="end">Tauri 2 · Rust · MCP · Claude · Cloudflare</text>
<g class="fade" style="animation-delay:0.00s"><rect x="30" y="70" width="600" height="66" rx="12" fill="#ffffff" stroke="#d1d9e0" stroke-width="1"/><text x="50" y="108" class="muted mono" font-size="11" letter-spacing="1.5">SURFACE</text><text x="180" y="99" class="ink" font-size="16" font-weight="700">Page, terminal and doc in one window</text><text x="180" y="120" class="muted" font-size="13">you and your agents work on the same thing, side by side</text></g><g class="fade" style="animation-delay:0.12s"><rect x="30" y="148" width="600" height="66" rx="12" fill="#ffffff" stroke="#3b5bdb" stroke-width="2"/><text x="50" y="186" class="acc mono" font-size="11" letter-spacing="1.5">PLAYS</text><text x="180" y="177" class="ink" font-size="16" font-weight="700">Multi-step agent pipelines</text><text x="180" y="198" class="muted" font-size="13">smart wiring between steps · human gate before new runs</text></g><g class="fade" style="animation-delay:0.24s"><rect x="30" y="226" width="600" height="66" rx="12" fill="#ffffff" stroke="#d1d9e0" stroke-width="1"/><text x="50" y="264" class="muted mono" font-size="11" letter-spacing="1.5">SKILLS</text><text x="180" y="255" class="ink" font-size="16" font-weight="700">Teach it once, by doing</text><text x="180" y="276" class="muted" font-size="13">reusable skills you can share, follow and install</text></g><g class="fade" style="animation-delay:0.36s"><rect x="30" y="304" width="600" height="66" rx="12" fill="#ffffff" stroke="#d1d9e0" stroke-width="1"/><text x="50" y="342" class="muted mono" font-size="11" letter-spacing="1.5">MCP + MODELS</text><text x="180" y="333" class="ink" font-size="16" font-weight="700">Connectors and model providers</text><text x="180" y="354" class="muted" font-size="13">MCP manager · provider routing · local terminal (PTY)</text></g>
<line x1="160" y1="78" x2="160" y2="370" stroke="#d1d9e0"/>
<circle r="4" fill="#7048e8"><animateMotion dur="3s" repeatCount="indefinite" path="M160 80 V368"/></circle>
<rect x="656" y="70" width="514" height="198" rx="12" style="fill:#ffffff" class="card"/>
<text x="676" y="94" class="acc mono" font-size="11" letter-spacing="1.5">BUILT BY ONE HUMAN + AN AGENT TEAM</text>
<g class="fade" style="animation-delay:0.50s"><circle cx="684" cy="123" r="13" fill="#3b5bdb" opacity=".16"/><text x="684" y="128" class="acc" font-size="12" font-weight="700" text-anchor="middle">P</text><text x="708" y="128" class="ink" font-size="14" font-weight="600">Pam <tspan class="muted" font-weight="400">· PM</tspan></text><text x="1150" y="128" class="muted" font-size="13" text-anchor="end">writes the PRD, ranks the backlog</text></g><g class="fade" style="animation-delay:0.60s"><circle cx="684" cy="159" r="13" fill="#3b5bdb" opacity=".16"/><text x="684" y="164" class="acc" font-size="12" font-weight="700" text-anchor="middle">D</text><text x="708" y="164" class="ink" font-size="14" font-weight="600">Des <tspan class="muted" font-weight="400">· Design</tspan></text><text x="1150" y="164" class="muted" font-size="13" text-anchor="end">reviews every screen against the ethos</text></g><g class="fade" style="animation-delay:0.70s"><circle cx="684" cy="195" r="13" fill="#3b5bdb" opacity=".16"/><text x="684" y="200" class="acc" font-size="12" font-weight="700" text-anchor="middle">B</text><text x="708" y="200" class="ink" font-size="14" font-weight="600">Bob <tspan class="muted" font-weight="400">· Builder</tspan></text><text x="1150" y="200" class="muted" font-size="13" text-anchor="end">cuts the branch, ships in slices</text></g><g class="fade" style="animation-delay:0.80s"><circle cx="684" cy="231" r="13" fill="#7048e8" opacity=".16"/><text x="684" y="236" class="ink" font-size="12" font-weight="700" text-anchor="middle">M</text><text x="708" y="236" class="ink" font-size="14" font-weight="600">Me <tspan class="muted" font-weight="400">· Founder</tspan></text><text x="1150" y="236" class="muted" font-size="13" text-anchor="end">greenlights the release</text></g>
<rect x="656" y="282" width="514" height="88" rx="12" style="fill:#ffffff" class="card"/>
<text x="676" y="300" class="acc mono" font-size="11" letter-spacing="1.5">GROWTH LOOP · SHARING IS ACQUISITION</text>
<text x="676" y="324" class="acc" font-size="13" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">Share</text><text x="752" y="324" class="muted" font-size="13">→</text><text x="772" y="324" class="ink" font-size="13" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">Open link</text><text x="848" y="324" class="muted" font-size="13">→</text><text x="868" y="324" class="ink" font-size="13" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">Install</text><text x="944" y="324" class="muted" font-size="13">→</text><text x="964" y="324" class="ink" font-size="13" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">Counted</text><text x="1040" y="324" class="muted" font-size="13">→</text><text x="1060" y="324" class="acc" font-size="13" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">Dashboard</text>
<text x="676" y="352" class="muted" font-size="12.5">Every shared space is an ad. Downloads attributed per space, no accounts.</text>
<line x1="30" y1="392" x2="1170" y2="392" stroke="#d1d9e0"/>
<text x="30" y="414" class="muted mono" font-size="13">v0.7 · 25+ Rust modules · 38k-line renderer · local-first, private by design · free for Mac</text>
