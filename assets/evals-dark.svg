<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="200" viewBox="0 0 1200 200" role="img" aria-label="Impact: 4% to 12% GMV share at Delivery Hero, $1.6B revenue protected at Wayfair, 48M Careem users, 20 fustat customers in month one, 150+ Boeing operators, 75 countries.">
<style>
  .bg{fill:#0d1117} .card{fill:#151b23;stroke:#3d444d}
  .ink{fill:#e6edf3;font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif} .muted{fill:#9198a1;font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif}
  .mono{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace} .acc{fill:#8ea6ff} .good{fill:#3fb950}
  .fade{opacity:0;animation:fade .7s ease-out forwards}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .pulse{animation:pulse 2s ease-in-out infinite;transform-origin:center;transform-box:fill-box}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
</style><defs>
  <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#262c36"/></pattern>
  <linearGradient id="rail" gradientUnits="userSpaceOnUse" x1="78" y1="0" x2="1140" y2="0"><stop offset="0" stop-color="#3d444d"/><stop offset=".55" stop-color="#8ea6ff"/><stop offset="1" stop-color="#c4a7ff"/></linearGradient>
  <linearGradient id="name" x1="0" x2="1"><stop offset="0" stop-color="#e6edf3"/><stop offset="1" stop-color="#8ea6ff"/></linearGradient>
</defs>
<rect class="card" x="1" y="1" width="1198" height="198" rx="18"/>
<text x="30" y="38" class="muted mono" font-size="14" letter-spacing="2.5">IMPACT · RESULTS THAT SHIPPED</text>
<g class="fade" style="animation-delay:0.0s"><rect class="card" x="30" y="58" width="176" height="118" rx="12" style="fill:#0d1117"/><text x="46" y="104" class="ink" font-size="30" font-weight="700" letter-spacing="-.5">4% → 12%</text><text x="46" y="134" class="muted" font-size="12.5">share of GMV</text><text x="46" y="156" class="acc mono" font-size="12">Delivery Hero</text></g><g class="fade" style="animation-delay:0.1s"><rect class="card" x="218" y="58" width="176" height="118" rx="12" style="fill:#0d1117"/><text x="234" y="104" class="ink" font-size="30" font-weight="700" letter-spacing="-.5">$1.6B</text><text x="234" y="134" class="muted" font-size="12.5">revenue protected</text><text x="234" y="156" class="acc mono" font-size="12">Wayfair</text></g><g class="fade" style="animation-delay:0.2s"><rect class="card" x="406" y="58" width="176" height="118" rx="12" style="fill:#0d1117"/><text x="422" y="104" class="ink" font-size="30" font-weight="700" letter-spacing="-.5">48M</text><text x="422" y="134" class="muted" font-size="12.5">Super App users</text><text x="422" y="156" class="acc mono" font-size="12">Careem (Uber)</text></g><g class="fade" style="animation-delay:0.3s"><rect class="card" x="594" y="58" width="176" height="118" rx="12" style="fill:#0d1117"/><text x="610" y="104" class="ink" font-size="30" font-weight="700" letter-spacing="-.5">20</text><text x="610" y="134" class="muted" font-size="12.5">customers, month one</text><text x="610" y="156" class="acc mono" font-size="12">fustat.ai</text></g><g class="fade" style="animation-delay:0.4s"><rect class="card" x="782" y="58" width="176" height="118" rx="12" style="fill:#0d1117"/><text x="798" y="104" class="ink" font-size="30" font-weight="700" letter-spacing="-.5">150+</text><text x="798" y="134" class="muted" font-size="12.5">operators served</text><text x="798" y="156" class="acc mono" font-size="12">Boeing</text></g><g class="fade" style="animation-delay:0.5s"><rect class="card" x="970" y="58" width="176" height="118" rx="12" style="fill:#0d1117"/><text x="986" y="104" class="ink" font-size="30" font-weight="700" letter-spacing="-.5">75</text><text x="986" y="134" class="muted" font-size="12.5">countries shipped</text><text x="986" y="156" class="acc mono" font-size="12">Delivery Hero</text></g>
</svg>