<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-label="Career path in four chapters: Enterprise systems 2006-2018, Data products 2018-2020, Consumer platforms 2020-2022, Applied AI at scale 2022 to now. Executive MBA, Durham University Business School.">
<style>
  .bg{fill:#ffffff} .card{fill:#f6f8fa;stroke:#d1d9e0}
  .ink{fill:#1f2328;font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif} .muted{fill:#59636e;font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif}
  .mono{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace} .acc{fill:#3b5bdb} .good{fill:#1a7f37}
  .fade{opacity:0;animation:fade .7s ease-out forwards}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .pulse{animation:pulse 2s ease-in-out infinite;transform-origin:center;transform-box:fill-box}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
</style><defs>
  <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#e4e8ec"/></pattern>
  <linearGradient id="rail" gradientUnits="userSpaceOnUse" x1="78" y1="0" x2="1140" y2="0"><stop offset="0" stop-color="#d1d9e0"/><stop offset=".55" stop-color="#3b5bdb"/><stop offset="1" stop-color="#7048e8"/></linearGradient>
  <linearGradient id="name" x1="0" x2="1"><stop offset="0" stop-color="#1f2328"/><stop offset="1" stop-color="#3b5bdb"/></linearGradient>
</defs>
<rect class="card" x="1" y="1" width="1198" height="398" rx="18"/>
<text x="56" y="56" class="muted mono" font-size="14" letter-spacing="2.5">THE PATH · FOUR CHAPTERS · 20 YEARS</text>
<path id="r" d="M78 152 H1140" stroke="url(#rail)" stroke-width="3" stroke-linecap="round" fill="none"/>
<path d="M1132 145 L1144 152 L1132 159" stroke="#7048e8" stroke-width="3" fill="none" stroke-linecap="round"/>
<circle r="5" fill="#7048e8"><animateMotion dur="5s" repeatCount="indefinite" path="M78 152 H1134"/>
  <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.1;.85;1" dur="5s" repeatCount="indefinite"/></circle>
<g class="fade" style="animation-delay:0.00s"><text x="72" y="122" class="muted mono" font-size="14">2006 – 2018</text><circle cx="78" cy="152" r="7" fill="#f6f8fa" stroke="#59636e" stroke-width="3"/><text x="72" y="204" class="ink" font-size="21" font-weight="600">Enterprise systems</text><text x="72" y="232" class="muted" font-size="15">Ericsson · Nokia</text><text x="72" y="254" class="muted" font-size="15">Etisalat · ITWorx</text><text x="72" y="300" class="ink mono" font-size="20" font-weight="600">12 yrs</text><text x="72" y="324" class="muted" font-size="13">telecom BSS &amp; CRM, EU · ME · Asia</text></g><g class="fade" style="animation-delay:0.15s"><text x="350" y="122" class="muted mono" font-size="14">2018 – 2020</text><circle cx="356" cy="152" r="7" fill="#f6f8fa" stroke="#3b5bdb" stroke-width="3"/><text x="350" y="204" class="ink" font-size="21" font-weight="600">Data products</text><text x="350" y="232" class="muted" font-size="15">Boeing Data</text><text x="350" y="254" class="muted" font-size="15">Analytics Labs</text><text x="350" y="300" class="acc mono" font-size="20" font-weight="600">150+</text><text x="350" y="324" class="muted" font-size="13">operators on a data marketplace</text></g><g class="fade" style="animation-delay:0.30s"><text x="628" y="122" class="muted mono" font-size="14">2020 – 2022</text><circle cx="634" cy="152" r="7" fill="#f6f8fa" stroke="#3b5bdb" stroke-width="3"/><text x="628" y="204" class="ink" font-size="21" font-weight="600">Consumer platforms</text><text x="628" y="232" class="muted" font-size="15">Wayfair</text><text x="628" y="254" class="muted" font-size="15">Careem (Uber)</text><text x="628" y="300" class="acc mono" font-size="20" font-weight="600">48M · $1.6B</text><text x="628" y="324" class="muted" font-size="13">super-app users · revenue protected</text></g><g class="fade" style="animation-delay:0.45s"><text x="906" y="122" class="acc mono" font-size="14">2022 → now</text><circle cx="912" cy="152" r="7" fill="#f6f8fa" stroke="#7048e8" stroke-width="3"/><circle cx="912" cy="152" r="14" fill="none" stroke="#7048e8" stroke-width="2" class="pulse"/><text x="906" y="204" class="ink" font-size="21" font-weight="600">Applied AI at scale</text><text x="906" y="232" class="muted" font-size="15">Delivery Hero · EBS Dx</text><text x="906" y="254" class="muted" font-size="15">ProductVoyagers Labs · rituals.pm</text><text x="906" y="300" class="acc mono" font-size="20" font-weight="600">4% → 12%</text><text x="906" y="324" class="muted" font-size="13">q-commerce share of GMV</text></g>
<line x1="56" y1="350" x2="1144" y2="350" stroke="#d1d9e0"/>
<text x="56" y="378" class="muted mono" font-size="14">EDUCATION</text>
<text x="168" y="378" class="ink" font-size="15" font-weight="600">Executive MBA · Durham University Business School</text>
<text x="1144" y="378" class="muted" font-size="14" text-anchor="end">Started as a software engineer. Never fully stopped.</text>
</svg>